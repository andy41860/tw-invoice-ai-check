services:

  # ---- API 推論服務 ----
  api:
    build: .
    env_file: .env
    environment:
      TZ: Asia/Taipei
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    ports:
      - "${APP_PORT:-8000}:${APP_PORT:-8000}"
    volumes:
      # 掛載 model/ 讓權重可在容器外管理，修改版本無需重新 build
      - ./model:/app/model
    depends_on:
      db:
        # 等待 db 通過 healthcheck 後才啟動 api
        condition: service_healthy
    healthcheck:
      # /health 在 lifespan 完成（含 warmup）後才會回應，確認模型已完全就緒
      test: ["CMD-SHELL", "curl -f http://localhost:${APP_PORT:-8000}/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 180s
    restart: unless-stopped

  # ---- PostgreSQL 對獎號碼資料庫 ----
  db:
    image: postgres:16
    environment:
      TZ: Asia/Taipei
      PGTZ: Asia/Taipei
      POSTGRES_DB: ${POSTGRES_DB:-invoice}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      # 對外曝露的 port（host 端存取用）；容器內固定 5432
      - "${POSTGRES_EXTERNAL_PORT:-5432}:5432"
    volumes:
      # 資料持久化：named volume
      - pgdata:/var/lib/postgresql/data
      # 首次初始化時自動執行 init.sql（建表 + 載入對獎號碼）
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-invoice}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # ---- Go batch 批次推論服務（執行一次即結束，不常駐）----
  batch:
    build:
      context: ./go_batch
      dockerfile: Dockerfile
    environment:
      TZ: Asia/Taipei
      API_URL: ${BATCH_API_URL:-http://api:8000}
      INPUT_DIR: ${CONTAINER_BATCH_INPUT_DIR:-/data/test_samples}
      WORKERS: ${BATCH_WORKERS:-2}
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-invoice}?sslmode=disable
    volumes:
      # 將 host 端圖片目錄掛載至容器，唯讀
      - ${BATCH_INPUT_DIR:-./test_samples}:${CONTAINER_BATCH_INPUT_DIR:-/data/test_samples}:ro
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: "no"

volumes:
  # PostgreSQL 資料持久化 volume
  pgdata:
